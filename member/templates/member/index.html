{% extends 'member/base.html' %}
{% load static %}
{% block title %}
Home
{% endblock title %}

{% block content %}
<nav class="navbar navbar-expand-lg sticky-top bg-body-tertiary">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">DineDash</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item text-center">
                    <a class="nav-link active" href="#">
                        <i class="bi bi-grid-fill category-icon"></i>
                        ALL
                    </a>
                </li>
                <li class="nav-item text-center">
                    <a class="nav-link" href="#">
                        <i class="bi bi-cup-hot-fill category-icon"></i>
                        BURGER
                    </a>
                </li>
                <li class="nav-item text-center">
                    <a class="nav-link" href="#">
                        <i class="bi bi-cup-hot-fill category-icon"></i>
                        COFFEE
                    </a>
                </li>
                <li class="nav-item text-center">
                    <a class="nav-link" href="#">
                        <i class="bi bi-egg-fried category-icon"></i>
                        FAST FOOD
                    </a>
                </li>
                <li class="nav-item text-center">
                    <a class="nav-link" href="#">
                        <i class="bi bi-circle category-icon"></i>
                        PIZZA
                    </a>
                </li>
                <li class="nav-item text-center">
                    <a class="nav-link" href="#">
                        <i class="bi bi-flower1 category-icon"></i>
                        SALAD
                    </a>
                </li>
            </ul>
        </div>
        <div class="d-flex align-items-center gap-3 px-2">
            <a href="#" class="btn btn-outline-secondary">
                <i class="bi bi-person"></i>
            </a>
            <a class="btn btn-outline-secondary position-relative" data-bs-toggle="modal" data-bs-target="#cartModal">
                <i class="bi bi-cart3"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary"
                    id="cartitemstotal">
                    {{total_items}}
                </span>
            </a>
        </div>
    </div>
</nav>

<section class="hero-section py-5">
    <div class="container">
        <div class="row align-items-center ">
            <div class="col-lg-6" data-aos="fade-right">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <i class="bi bi-geo-alt-fill text-primary"></i>
                    <span>Greatwall Athiriver</span>
                </div>
                <h1 class="display-4 fw-bold mb-4">Discover the richness of God's presence.</h1>
                <div class="search-bar mb-4">
                    <input type="text" class="form-control form-control-lg pe-5" placeholder="Fell free to talk to us">
                    <button class="btn btn-primary">
                        <i class="bi bi-chat-dots"></i>
                    </button>
                </div>
            </div>
            <div class="col-lg-6 mt-3" data-aos="fade-left">
                <img src="/static/assets/img/pulpit.jpg" alt="Food delivery illustration" class="img-fluid rounded-3">
            </div>
        </div>
    </div>
</section>

<button class="theme-toggle" aria-label="Toggle theme">
    <i class="bi bi-sun-fill"></i>
</button> -->
{% endblock content %}
